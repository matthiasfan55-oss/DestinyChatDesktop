name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore DestinyChatDesktop.sln

      - name: Build
        run: dotnet build DestinyChatDesktop.sln -c Release --no-restore

      - name: Test
        run: dotnet test DestinyChatDesktop.sln -c Release --no-build --verbosity normal
