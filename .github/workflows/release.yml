name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches app version
        shell: pwsh
        run: |
          $config = Get-Content appsettings.json | ConvertFrom-Json
          $expectedTag = "v$($config.appVersion)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match appVersion $($config.appVersion). Expected $expectedTag."
          }

      - name: Build portable package
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File .\build.ps1 -CreatePortablePackage

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/DestinyChatDesktop-portable.zip
            artifacts/DestinyChatDesktop-portable.sha256
          generate_release_notes: true
